name: offline-reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,report]"
      - name: Verify retained-source outputs
        run: python scripts/reproduce.py --check
      - name: Run offline tests
        run: pytest
      - name: Lint and format check
        run: ruff check . && ruff format --check .
      - name: Static typing
        run: mypy
